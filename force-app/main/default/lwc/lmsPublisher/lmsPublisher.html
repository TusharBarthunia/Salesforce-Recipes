<template>
    <lightning-card title="LMS Publisher" icon-name="utility:send">
        <div class="slds-p-around_medium">
            <lightning-input
                label="Message"
                value={messageText}
                onchange={handleInputChange}
            ></lightning-input>

            <div class="slds-m-top_small">
                <lightning-button
                    label="Publish"
                    variant="brand"
                    onclick={handlePublish}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
