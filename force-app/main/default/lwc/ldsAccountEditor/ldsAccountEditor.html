<template>

    <lightning-card title="Edit Account">

        <div class="slds-p-around_medium">

            <lightning-record-edit-form
                record-id={recordId}
                object-api-name="Account"
                onsuccess={handleSuccess}
                onerror={handleError}>

                <lightning-messages>
                </lightning-messages>

                <lightning-input-field
                    field-name="Name">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Phone">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Industry">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Website">
                </lightning-input-field>

                <div class="slds-m-top_medium">

                    <lightning-button
                        type="submit"
                        variant="brand"
                        label="Save">
                    </lightning-button>

                </div>

            </lightning-record-edit-form>

        </div>

    </lightning-card>

</template>
