<template>

    <lightning-card title="Account Detail">

        <div class="slds-p-around_medium">

            <template lwc:if={recordId}>

                <lightning-record-view-form
                    record-id={recordId}
                    object-api-name="Account">

                    <lightning-output-field
                        field-name="Name">
                    </lightning-output-field>

                    <lightning-output-field
                        field-name="Industry">
                    </lightning-output-field>

                    <lightning-output-field
                        field-name="Phone">
                    </lightning-output-field>

                    <lightning-output-field
                        field-name="Website">
                    </lightning-output-field>

                </lightning-record-view-form>

            </template>

            <template lwc:else>

                <p>
                    Select an Account from the Account List.
                </p>

            </template>

        </div>

    </lightning-card>

</template>
