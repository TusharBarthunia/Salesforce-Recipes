<template>
    <lightning-card title="LMS Subscriber" icon-name="utility:comments">
        <div class="slds-p-around_medium">
            <p class="slds-text-heading_small">Latest message:</p>
            <p class="slds-m-top_x-small">{message}</p>
        </div>
        <div class="slds-m-top_small">
                <lightning-button
                    label="Subscribe"
                    variant="brand"
                    onclick={handleSubscribe}
                ></lightning-button>
            </div>
    </lightning-card>

</template>
